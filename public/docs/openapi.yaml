            schema:
              type: object
              properties:
                account_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                pricing_strategy:
                  type: string
                  description: ''
                  example: competitive
                  enum:
                    - margin
                    - fixed
                    - competitive
                price_margin:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 1
                tax_percentage:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 13
                marketplace_commission:
                  type: number
                  description: 'Must be at least 0.'
                  example: 46
                marketplace_fixed_fee:
                  type: number
                  description: 'Must be at least 0.'
                  example: 28
                marketplace_shipping_fee:
                  type: number
                  description: 'Must be at least 0.'
                  example: 30
                status:
                  type: string
                  description: ''
                  example: pending
                  enum:
                    - active
                    - inactive
                    - pending
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the store.'
        example: consequatur
