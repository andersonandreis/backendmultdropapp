    post:
      summary: ''
      operationId: postApiV1Stores
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                supplier_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the suppliers table.'
                  example: 17
                platform:
                  type: string
                  description: ''
                  example: hubaisimulator
                  enum:
                    - mercadolivre
                    - shopee
                    - shopify
                    - hubaisimulator
                account_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mqeopfuudtdsufvyvddqa
                pricing_strategy:
                  type: string
                  description: ''
                  example: competitive
                  enum:
                    - margin
                    - fixed
                    - competitive
                  nullable: true
                price_margin:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 13
                  nullable: true
                tax_percentage:
                  type: number
                  description: 'Must be at least 0. Must not be greater than 100.'
                  example: 13
                  nullable: true
                marketplace_commission:
                  type: number
                  description: 'Must be at least 0.'
                  example: 28
                  nullable: true
              required:
                - supplier_id
                - platform
                - account_name
