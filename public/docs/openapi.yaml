openapi: 3.0.3
info:
  title: 'HubAI Platform API'
  description: 'REST API for the HubAI dropshipping platform. Used by the Lovable frontend (hubai.io).'
  version: 1.0.0
servers:
  -
    url: 'https://api.hubai.io'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/documentation:
    get:
      summary: 'Handles the API request and renders the Swagger documentation view.'
      operationId: handlesTheAPIRequestAndRendersTheSwaggerDocumentationView
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>HubAI API</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"https://api.hubai.io/api/swagger-json/asset/swagger-ui.css?v=66b916fbe27b7383f8c1094afbb52976\">\n    <link rel=\"icon\" type=\"image/png\" href=\"https://api.hubai.io/api/swagger-json/asset/favicon-32x32.png?v=40d4f2c38d1cd854ad463f16373cbcb6\" sizes=\"32x32\"/>\n    <link rel=\"icon\" type=\"image/png\" href=\"https://api.hubai.io/api/swagger-json/asset/favicon-16x16.png?v=f0ae831196d55d8f4115b6c5e8ec5384\" sizes=\"16x16\"/>\n    <style>\n    html\n    {\n        box-sizing: border-box;\n        overflow: -moz-scrollbars-vertical;\n        overflow-y: scroll;\n    }\n    *,\n    *:before,\n    *:after\n    {\n        box-sizing: inherit;\n    }\n\n    body {\n      margin:0;\n      background: #fafafa;\n    }\n    </style>\n    </head>\n\n<body >\n<div id=\"swagger-ui\"></div>\n\n<script src=\"https://api.hubai.io/api/swagger-json/asset/swagger-ui-bundle.js?v=45ccffa901bb9a18069b6c20d3363413\"></script>\n<script src=\"https://api.hubai.io/api/swagger-json/asset/swagger-ui-standalone-preset.js?v=7289ecfaa5507c519cb95606e6216dbb\"></script>\n<script>\n    window.onload = function() {\n        const urls = [];\n\n                    urls.push({name: \"HubAI API\", url: \"https://api.hubai.io/api/swagger-json?api-docs.json\"});\n        \n        // Build a system\n        const ui = SwaggerUIBundle({\n            dom_id: '#swagger-ui',\n            urls: urls,\n            \"urls.primaryName\": \"HubAI API\",\n            operationsSorter: null,\n            configUrl: null,\n            validatorUrl: null,\n            oauth2RedirectUrl: \"https://api.hubai.io/api/oauth2-callback\",\n\n            requestInterceptor: function(request) {\n                request.headers['X-CSRF-TOKEN'] = '';\n                return request;\n            },\n\n            presets: [\n                SwaggerUIBundle.presets.apis,\n                SwaggerUIStandalonePreset\n            ],\n\n            plugins: [\n                SwaggerUIBundle.plugins.DownloadUrl\n            ],\n\n            layout: \"StandaloneLayout\",\n            docExpansion : \"none\",\n            deepLinking: true,\n            filter: true,\n            persistAuthorization: \"false\",\n\n        })\n\n        window.ui = ui\n\n            }\n</script>\n</body>\n</html>\n"
      tags:
        - Endpoints
  /api/swagger-json:
    get:
      summary: 'Handles requests for API documentation and returns the corresponding file content.'
      operationId: handlesRequestsForAPIDocumentationAndReturnsTheCorrespondingFileContent
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Unable to locate documentation file at: "/home/api.hubai.io/public_html/storage/api-docs/api-docs.json"'
                properties:
                  message:
                    type: string
                    example: 'Unable to locate documentation file at: "/home/api.hubai.io/public_html/storage/api-docs/api-docs.json"'
      tags:
        - Endpoints
  '/api/swagger-json/asset/{asset}':
    get:
      summary: 'Serves a specific documentation asset for the Swagger UI interface.'
      operationId: servesASpecificDocumentationAssetForTheSwaggerUIInterface
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: '(consequatur) - this L5 Swagger asset is not allowed'
                properties:
                  message:
                    type: string
                    example: '(consequatur) - this L5 Swagger asset is not allowed'
      tags:
        - Endpoints
    parameters:
      -
        in: path
        name: asset
        description: 'The asset.'
        example: consequatur
        required: true
        schema:
          type: string
  /api/oauth2-callback:
    get:
      summary: 'Handles the OAuth2 callback and retrieves the required file for the redirect.'
      operationId: handlesTheOAuth2CallbackAndRetrievesTheRequiredFileForTheRedirect
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!doctype html>\n<html lang=\"en-US\">\n<body>\n<script src=\"oauth2-redirect.js\"></script>\n</body>\n</html>\n"
      tags:
        - Endpoints
