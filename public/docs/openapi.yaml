                custom_title:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: mniihfqcoynlazghdtqtq
                custom_description:
                  type: string
                  description: ''
                  example: consequatur
                  nullable: true
                custom_price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 45
                  nullable: true
                pricing_mode:
                  type: string
                  description: ''
                  example: margin
